<text x="36" y="282" fill="#C9C9C9" font-size="11">Python 与 Node 双重校验：四档零和 · 有限性 · 分母非零 · 帧对齐 · 宽度求和</text>
<text x="36" y="298" fill="#C9C9C9" font-size="11">snapshot.json · meta.proxies 代理清单 · index_live.html 注入投屏可见披露条</text>
<line x1="480" y1="304" x2="480" y2="322" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#a1)"/>

