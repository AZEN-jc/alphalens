<text x="36" y="346" fill="#E8B33A" font-size="12" font-weight="bold">L4  核心引擎 / CORE ENGINE  (core.js)</text>
<text x="36" y="366" fill="#C9C9C9" font-size="11">setSource → validate → computeAll → fundSeries / volumeRadar / temperature</text>
<text x="36" y="382" fill="#C9C9C9" font-size="11">scoreReport / derivSignals / treemap · 全部纯函数，零外部依赖</text>
<line x1="480" y1="388" x2="480" y2="406" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#a1)"/>

