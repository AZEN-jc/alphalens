<text x="36" y="430" fill="#E8B33A" font-size="12" font-weight="bold">L5  渲染与交互 / UI  (index.html)</text>
<text x="36" y="450" fill="#C9C9C9" font-size="11">四面板 · 48 帧逐帧回放 · 深链 panel/code/frame · 原生 SVG 图表</text>
<text x="36" y="466" fill="#C9C9C9" font-size="11">姓名学号水印 · 打印电子签章 · 数据口径条常驻</text>

<text x="24" y="500" fill="#4AF626" font-size="11">注入契约  window.AlphaLens.load(s)  →  setSource(s)  →  computeAll(code)  →  render()</text>
