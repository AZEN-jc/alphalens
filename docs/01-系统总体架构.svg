<text x="36" y="178" fill="#E8B33A" font-size="12" font-weight="bold">L2  采集与缓存 / FETCH AND CACHE</text>
<text x="36" y="198" fill="#C9C9C9" font-size="11">fetch_snapshot.py：12 段独立抓取 · 逐段最小缓存 cache/ · 单段失败不拖垮同组真数据</text>
<text x="36" y="214" fill="#C9C9C9" font-size="11">curl 子进程绕过 TLS 指纹过滤 · --offline 从缓存重建 · 网络请求为零</text>
<line x1="480" y1="220" x2="480" y2="238" stroke="#8A8A8A" stroke-width="1.5" marker-end="url(#a1)"/>

