<svg id="fig4" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#0A0A0A;font-family:Menlo,Consolas,'PingFang SC',monospace">
<defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8A8A8A"/></marker></defs>
<rect width="960" height="560" fill="#0A0A0A"/>
<text x="24" y="32" fill="#EAEAEA" font-size="18" font-weight="bold">FIG 4  /  核心算法流程</text>
<text x="24" y="51" fill="#8A8A8A" font-size="11">入口校验 → 六路指标计算 → 四面板渲染 · 全部纯函数</text>
<line x1="24" y1="62" x2="936" y2="62" stroke="#333"/>

<rect x="330" y="76" width="300" height="38" fill="#121212" stroke="#E8B33A"/>
<text x="480" y="100" fill="#E8B33A" font-size="12" text-anchor="middle">setSource(snapshot) → validate → computeAll(code)</text>
<line x1="480" y1="114" x2="480" y2="134" stroke="#8A8A8A" marker-end="url(#a4)"/>

<rect x="180" y="138" width="600" height="60" fill="#1A1010" stroke="#FF2A2A"/>
<text x="480" y="158" fill="#FF2A2A" font-size="12" font-weight="bold" text-anchor="middle">入口校验 / VALIDATE</text>
<text x="480" y="177" fill="#C9C9C9" font-size="10" text-anchor="middle">帧数≥12 · OHLC 合法 · 四档零和 · 时间戳对齐 · 宽度求和 · 分母有限非零</text>
<line x1="480" y1="198" x2="480" y2="218" stroke="#8A8A8A" marker-end="url(#a4)"/>

<g font-size="10">
<rect x="16" y="222" width="180" height="176" fill="#121212" stroke="#333"/>
<text x="106" y="244" fill="#EAEAEA" font-size="11" font-weight="bold" text-anchor="middle">fundSeries</text>
<text x="28" y="266" fill="#C9C9C9">主力 = 超大 + 大单</text>
<text x="28" y="284" fill="#C9C9C9">散户 = 中单 + 小单</text>
<text x="28" y="302" fill="#C9C9C9">两条累计互为镜像</text>
<text x="28" y="320" fill="#C9C9C9">六帧斜率 + 量比</text>
<text x="28" y="338" fill="#4AF626">吸筹 / 派发信号</text>
<text x="28" y="358" fill="#8A8A8A">同类间隔≥9 帧</text>
<text x="28" y="380" fill="#8A8A8A">四档严格零和</text>

<rect x="208" y="222" width="180" height="176" fill="#121212" stroke="#333"/>
<text x="298" y="244" fill="#EAEAEA" font-size="11" font-weight="bold" text-anchor="middle">volumeRadar</text>
<text x="220" y="266" fill="#C9C9C9">量比 = 末帧 / 前五帧均</text>
<text x="220" y="284" fill="#C9C9C9">换手 = 成交量 / 流通股</text>
<text x="220" y="302" fill="#C9C9C9">贴近高点判定</text>
<text x="220" y="320" fill="#C9C9C9">涨跌幅方向</text>
<text x="220" y="338" fill="#4AF626">底部放量突破</text>
<text x="220" y="356" fill="#4AF626">高位缩量滞涨</text>
<text x="220" y="374" fill="#FF2A2A">天量 / 放量下跌</text>

<rect x="400" y="222" width="180" height="176" fill="#121212" stroke="#333"/>
<text x="490" y="244" fill="#EAEAEA" font-size="11" font-weight="bold" text-anchor="middle">temperature</text>
<text x="412" y="266" fill="#C9C9C9">涨跌家数比  0.35</text>
<text x="412" y="284" fill="#C9C9C9">涨跌停比    0.25</text>
<text x="412" y="302" fill="#C9C9C9">封板稳固度  0.20</text>
<text x="412" y="320" fill="#C9C9C9">成交额增减  0.20</text>
<text x="412" y="340" fill="#E8B33A">五档温度分区</text>
<text x="412" y="358" fill="#E8B33A">对应仓位建议</text>
<text x="412" y="380" fill="#8A8A8A">冰点 → 过热</text>

<rect x="592" y="222" width="180" height="176" fill="#121212" stroke="#333"/>
<text x="682" y="244" fill="#EAEAEA" font-size="11" font-weight="bold" text-anchor="middle">scoreReport</text>
<text x="604" y="266" fill="#C9C9C9">盈利能力 / 成长</text>
<text x="604" y="284" fill="#C9C9C9">现金流含金量</text>
<text x="604" y="302" fill="#C9C9C9">财务安全性</text>
<text x="604" y="320" fill="#C9C9C9">运营管理效率</text>
<text x="604" y="340" fill="#E8B33A">A≥75 B≥55</text>
<text x="604" y="358" fill="#E8B33A">C≥35 D 其余</text>
<text x="604" y="380" fill="#FF2A2A">红绿灯规则叠加</text>

<rect x="784" y="222" width="160" height="176" fill="#121212" stroke="#333"/>
<text x="864" y="244" fill="#EAEAEA" font-size="11" font-weight="bold" text-anchor="middle">derivSignals</text>
<text x="796" y="266" fill="#C9C9C9">基差 = 期货 - 现货</text>
<text x="796" y="284" fill="#C9C9C9">环比阈值 ±6</text>
<text x="796" y="302" fill="#4AF626">多头抢跑 / 贴水</text>
<text x="796" y="320" fill="#C9C9C9">权利金比代理</text>
<text x="796" y="338" fill="#C9C9C9">商品板块联动</text>
<text x="796" y="360" fill="#E8B33A">treemap</text>
<text x="796" y="378" fill="#8A8A8A">行贪心布局</text>

<line x1="480" y1="218" x2="106" y2="220" stroke="#8A8A8A" marker-end="url(#a4)"/>
<line x1="480" y1="218" x2="298" y2="220" stroke="#8A8A8A" marker-end="url(#a4)"/>
<line x1="480" y1="218" x2="490" y2="220" stroke="#8A8A8A" marker-end="url(#a4)"/>
<line x1="480" y1="218" x2="682" y2="220" stroke="#8A8A8A" marker-end="url(#a4)"/>
<line x1="480" y1="218" x2="864" y2="220" stroke="#8A8A8A" marker-end="url(#a4)"/>
</g>

<line x1="106" y1="398" x2="106" y2="430" stroke="#8A8A8A"/>
<line x1="298" y1="398" x2="298" y2="430" stroke="#8A8A8A"/>
<line x1="490" y1="398" x2="490" y2="430" stroke="#8A8A8A"/>
<line x1="682" y1="398" x2="682" y2="430" stroke="#8A8A8A"/>
<line x1="864" y1="398" x2="864" y2="430" stroke="#8A8A8A"/>
<line x1="106" y1="430" x2="864" y2="430" stroke="#8A8A8A"/>
<line x1="480" y1="430" x2="480" y2="450" stroke="#8A8A8A" marker-end="url(#a4)"/>

<rect x="300" y="454" width="360" height="42" fill="#121212" stroke="#4AF626"/>
<text x="480" y="480" fill="#4AF626" font-size="13" font-weight="bold" text-anchor="middle">四面板渲染 · 逐帧回放 · 水印签章</text>

<text x="24" y="528" fill="#8A8A8A" font-size="10">图注：任一校验不通过即抛错，非法状态在入口被拦截，不进入指标计算与渲染。</text>
</svg>