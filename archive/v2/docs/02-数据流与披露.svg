<text x="726" y="138" fill="#C9C9C9" font-size="9" text-anchor="middle">snapshot.json</text>
<text x="726" y="153" fill="#C9C9C9" font-size="9" text-anchor="middle">provenance 披露条</text>
<text x="726" y="168" fill="#C9C9C9" font-size="9" text-anchor="middle">运行时措辞修正</text>

<rect x="816" y="96" width="128" height="86" fill="#121212" stroke="#4AF626"/>
