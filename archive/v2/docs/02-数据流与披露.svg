</g>

<line x1="24" y1="202" x2="936" y2="202" stroke="#333"/>
<text x="24" y="224" fill="#E8B33A" font-size="12" font-weight="bold">代理字段随行路径 / PROVENANCE</text>
<text x="24" y="246" fill="#C9C9C9" font-size="11">meta.proxies（七条） → CLI 打印 → 注入页 #al-provenance 可见条 → 运行时文本替换</text>
<text x="24" y="268" fill="#C9C9C9" font-size="11">300750 / 002027 四档资金为量价代理 · 期权 PCR 为权利金比 · IV 为 20 日已实现波动率</text>
<text x="24" y="290" fill="#C9C9C9" font-size="11">炸板数、昨日成交额、研发费用率为估算或占位 · 600519 资金与财报、板块净额、指数与基差为真实值</text>

<line x1="24" y1="310" x2="936" y2="310" stroke="#333"/>
<text x="24" y="332" fill="#E8B33A" font-size="12" font-weight="bold">离线分支 / OFFLINE PATH</text>
<text x="24" y="354" fill="#4AF626" font-size="11">fetch_snapshot.py --offline → 跳过全部抓取 → 直接读 cache/ → 网络请求 0 次</text>
<text x="24" y="376" fill="#C9C9C9" font-size="11">重建快照与原快照逐字段一致，仅 meta.generated 时间戳不同 · 答辩断网路径实测通过</text>
<text x="24" y="404" fill="#8A8A8A" font-size="10">图注：真实值与代理值在投屏上分区呈现，代理值不作为投资结论的唯一依据。</text>
</svg>