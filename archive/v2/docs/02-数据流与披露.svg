<svg id="fig2" viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#0A0A0A;font-family:Menlo,Consolas,'PingFang SC',monospace">
<defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8A8A8A"/></marker></defs>
<rect width="960" height="470" fill="#0A0A0A"/>
<text x="24" y="32" fill="#EAEAEA" font-size="18" font-weight="bold">FIG 2  /  数据流与代理披露</text>
<text x="24" y="51" fill="#8A8A8A" font-size="11">七类外部源 → 分段缓存 → 校验 → 快照 → 注入 → 渲染 · 代理信息全程随行</text>
<line x1="24" y1="62" x2="936" y2="62" stroke="#333"/>

<g font-size="11">
<rect x="16" y="96" width="140" height="86" fill="#121212" stroke="#E8B33A"/>
<text x="86" y="118" fill="#E8B33A" font-size="11" text-anchor="middle">外部数据源</text>
<text x="86" y="138" fill="#C9C9C9" font-size="9" text-anchor="middle">日线 / 四档资金</text>
<text x="86" y="153" fill="#C9C9C9" font-size="9" text-anchor="middle">行业 / 宽度 / 财报</text>
<text x="86" y="168" fill="#C9C9C9" font-size="9" text-anchor="middle">期货 / 期权 / 指数</text>

<rect x="176" y="96" width="140" height="86" fill="#121212" stroke="#333"/>
<text x="246" y="118" fill="#EAEAEA" font-size="11" text-anchor="middle">分段抓取</text>
<text x="246" y="138" fill="#C9C9C9" font-size="9" text-anchor="middle">12 段独立单元</text>
<text x="246" y="153" fill="#C9C9C9" font-size="9" text-anchor="middle">curl 通道取四档</text>
<text x="246" y="168" fill="#C9C9C9" font-size="9" text-anchor="middle">单段失败即回退</text>

<rect x="336" y="96" width="140" height="86" fill="#121212" stroke="#333"/>
<text x="406" y="118" fill="#EAEAEA" font-size="11" text-anchor="middle">独立缓存</text>
<text x="406" y="138" fill="#C9C9C9" font-size="9" text-anchor="middle">cache/ 12 段</text>
<text x="406" y="153" fill="#C9C9C9" font-size="9" text-anchor="middle">10 CACHE</text>
<text x="406" y="168" fill="#C9C9C9" font-size="9" text-anchor="middle">2 FALLBACK</text>

<rect x="496" y="96" width="140" height="86" fill="#121212" stroke="#333"/>
<text x="566" y="118" fill="#EAEAEA" font-size="11" text-anchor="middle">双重校验</text>
<text x="566" y="138" fill="#C9C9C9" font-size="9" text-anchor="middle">四档零和</text>
<text x="566" y="153" fill="#C9C9C9" font-size="9" text-anchor="middle">有限性 / 分母</text>
<text x="566" y="168" fill="#C9C9C9" font-size="9" text-anchor="middle">13/13 一致</text>

<rect x="656" y="96" width="140" height="86" fill="#121212" stroke="#FF2A2A"/>
